services:
  mcp:
    restart: unless-stopped

  app:
    restart: unless-stopped
    environment:
      N8N_CHAT_URL: http://n8n:5678/webhook/58669582-35ef-4a9c-8165-887eb88637e0/chat

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.7
    restart: unless-stopped
    env_file:
      - .env.n8n
    environment:
      TZ: Asia/Kolkata
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_EDITOR_BASE_URL: http://localhost:5679/
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
